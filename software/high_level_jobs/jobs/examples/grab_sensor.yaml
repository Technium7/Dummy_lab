job_id: grab_sensor_demo
initial_state: CONNECT

states:
  CONNECT:
    description: Open serial to robot
    steps:
      - action: robot_check_connected
        params: {}

  ENABLE:
    description: Enable drives
    steps:
      - action: robot_ensure_enabled
        params: {}

  GRAB:
    description: Detect sensor, plan grasp, execute
    steps:
      - action: grab_sensor
        params:
          config: software/high_level_jobs/subtasks/grab_sensor/config/default_grasp.yaml
          execute: true
          home_first: true
          open_gripper: true
          close_gripper: true
          retreat_after_close: true

transitions:
  - from: CONNECT
    event: done
    to: ENABLE
  - from: ENABLE
    event: done
    to: GRAB

terminal_states:
  - GRAB
