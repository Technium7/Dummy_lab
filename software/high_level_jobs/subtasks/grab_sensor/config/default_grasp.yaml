# Pick up the TABLE OBJECT (sensor workpiece on the table).
#
# The D415 is NOT the object being picked. It is a fixed camera that LOOKS at the table.
# You only configure where that camera is mounted relative to the robot (camera_to_robot).
# Vision finds the object; grasp_on_object turns that into a gripper target.

# --- Fixed hardware calibration (set once) ---------------------------------
# Camera optical frame -> robot base frame (same as PyBullet planner world).
# From eye-to-hand solve: software/camera/calibration/runs/run_20260608_233832/camera_to_robot.json
camera_to_robot:
  translation_m: [0.02473759406925837, 0.34061158616990395, 0.3150136487329851]
  rpy_deg: [102.40187601838566, -39.56813467465095, -1.9826286775152475]

# --- Vision (top/overhead — detection/top_detection) -------------------------
# detection_profile: top  -> YOLO + base_point.pt only (overhead camera)
# detection_profile: side -> YOLO + grasp_point.pt + base ellipse (oblique camera)
detection_profile: top
vision_mode: yolo_grasp

# Pin RealSense serial (same overhead/overview cam as insert_sensor cameras.overhead).
# Required when multiple D415s are plugged in; empty = first device Librealsense finds.
camera_serial: "104122062828"

yolo:
  model_path: software/high_level_jobs/subtasks/grab_sensor/detection/top_detection/dataset/base_keypoints/model/sensor_yolo.pt
  class_name: sensor
  confidence: 0.35
  crop_padding_px: 16

grasp_net:
  base_only: true
  base_model_path: software/high_level_jobs/subtasks/grab_sensor/detection/top_detection/dataset/base_keypoints/model/base_point.pt
  depth_patch_radius_px: 3
  predict_on: crop
  bbox_margin_px: 12
  depth_min_m: 0.25
  depth_max_m: 0.85

# Grasp XYZ from detected base center on table (top view: grasp XY = base XY)
grasp_position_from_table_base: true

# Optional: pin a specific table calib run. If omitted, detect/plan/execute use the newest
# valid table_calib.json under software/camera/calibration_table/runs/
# table_calib_path: software/camera/calibration_table/runs/run_20260618_211107/table_calib.json

# Motion planning: tip height on sensor; TCP offset is in the grasp URDF (``grasp_tcp_link``)
motion_planning:
  grasp_height_above_table_mm: 93.0

# Used when grasp_orientation_mode: fixed_robot
# Taught input [a, b, c] (deg) -> planner world RPY:
#   roll = -a + grasp_rpy_roll_offset_deg, pitch = -b, yaw = grasp_rpy_yaw_base_deg + c - atan2(x, y)
fixed_grasp_abc_input_deg: [-5, 0.0, 0]
grasp_rpy_roll_offset_deg: -15.0
grasp_rpy_yaw_base_deg: 180.0
grasp_c_from_xy: true

grasp_orientation_tol_deg: 50.0
grasp_position_tol_mm: 20.0

# Robot base pose in optical table frame (inches, same convention as view_table_calibration)
# Grasp robot GUI ≈ (-robot_x_in * 1in + table_x, -robot_y_in * 1in + table_y, table_z - robot_z_in)
robot_in_table_frame:
  translation_in: [-4.5, -3.4, 0.55]
  rpy_deg: [0, 0, 0]

# --- Legacy depth segmentation (used when vision_mode: depth_segment) ------
segmentation:
  # Depth band over the table surface where the object appears
  min_depth_m: 0.28
  max_depth_m: 0.52
  min_area_px: 400
  morph_kernel_px: 5

# --- Grasp target from vision ----------------------------------------------
# How to build the grasp pose after the camera locates the object:
#
#   follow_object  — vision gives object pose (PCA); grasp_on_object adds tilt/offset
#   fixed_robot    — vision gives grasp XYZ only; orientation from fixed_grasp_abc_input_deg
grasp_orientation_mode: fixed_robot

# Taught offset from detected object frame to gripper target (not the camera).
# Object frame from PCA: X = long edge, Z = face normal pointing up from table.
grasp_on_object:
  position_mm: [0.0, 0.0, 0.0]
  rpy_deg: [0.0, 0.0, 180.0]       # e.g. 15 deg wrist tilt about object Y
  approach_offset_mm: 5.0

approach:
  plan_pre_grasp: true   # if false: HOME -> grasp only (no pre-grasp waypoint)
  pre_grasp_offset_mm: 40.0
  pre_grasp_along_xy: true   # retreat toward robot along XY (false = world +Z)
  pre_grasp_orientation_tol_deg: 90.0   # relaxed vs grasp_orientation_tol_deg (final grasp)
  post_grasp_lift_mm: 120.0             # after grasp: retreat straight up along world +Z
  plan_return_home: true                # after lift: iLQR back to HOME joints
  retreat_after_close_mm: 40.0

# Robot execution (#I_LIMIT_J before !START; 0 = skip). Init HOME uses stream waypoints, not ``!HOME``.
execute:
  joint_current_limit_a: 0
  home_confirm_attempts: 3

paths:
  # Grasp URDF: base xacro + ``grasp_tcp_fixed`` on link6_1 (edit offset in URDF by hand).
  robot: robot_design/Dummy_ros2_gripper_description/urdf/Dummy_ros2_gripper_grasp.urdf
  end_link: link6_1
  tcp_link: grasp_tcp_link
  save_debug_dir: software/high_level_jobs/subtasks/grab_sensor/debug

# Robot-only planning scene (no packaging-station mesh).
load_environment: false

enable_collision: false
plan_seed: 42
