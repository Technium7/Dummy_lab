# Insert sensor: ACT (Action Chunking Transformer).
# RGB (2 cams) via frozen DINOv2 + Depth CNN + joints + gripper → temporal Transformer → ACT.
#
# Train:  python -m high_level_jobs.subtasks.insert_sensor --arch act --train
# Deploy: python -m high_level_jobs.subtasks.insert_sensor --arch act --deploy
# Diffusion sibling: --arch diffusion (see default_diffusion.yaml)

arch: act

dataset_dir: software/high_level_jobs/subtasks/insert_sensor/dataset/episodes
model_path: software/high_level_jobs/subtasks/insert_sensor/runs/latest/policy.pt

# --- Model (ACT) ---
history_len: 8
action_horizon: 8
temporal: transformer
latent_dim: 256
img_width: 224           # DINOv2 needs multiples of 14
img_height: 224
depth_min_m: 0.25
depth_max_m: 0.85
num_cameras: 2
use_depth: true          # false = RGB only
vision_backbone: dinov2_vits14   # dinov2_vits14 | dinov2_vitb14 | cnn
freeze_backbone: true

style_dim: 32            # ACT CVAE latent
kl_weight: 10.0

# --- Training ---
epochs: 80
batch_size: 4            # lower for DINOv2 VRAM (raise if GPU allows)
lr: 0.0003
val_frac: 0.15
seed: 42
num_workers: 0

# --- Cameras ---
# Recording captures every role listed here. Train/deploy still use num_cameras (overhead+side).
cameras:
  overhead:
    serial: "104122062828"
    exposure_us: 80
  side:
    serial: "024122062290"
    exposure_us: 200
  side2:
    serial: "925322061385"          # pin via: python software/camera/live_view.py --list
    exposure_us: 200
record_camera_serial: ""
require_camera_serials: true

# --- Recording ---
record_hz: 15.0

# --- Deployment ---
deploy_hz: 15.0
action_scale: 1.0
deploy_speed_scale: 2.0
gripper_close_threshold: 0.5
