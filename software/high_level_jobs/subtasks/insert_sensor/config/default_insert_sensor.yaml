# Insert sensor: ACT with CNN vision (same encoder as diffusion — fair comparison).
# RGB-D CNN + joints/gripper → temporal Transformer → ACT CVAE chunk.
#
# Train:  python -m high_level_jobs.subtasks.insert_sensor --arch act --train
# Deploy: python -m high_level_jobs.subtasks.insert_sensor --arch act --deploy
# DINOv2 variant: config/default_act_dinov2.yaml

arch: act

dataset_dir: software/high_level_jobs/subtasks/insert_sensor/dataset/episodes
model_path: software/high_level_jobs/subtasks/insert_sensor/runs/act_cnn/latest/policy.pt

# --- Model (ACT + CNN vision, matched to diffusion) ---
history_len: 8
action_horizon: 8
temporal: transformer
latent_dim: 256
img_width: 160            # match diffusion
img_height: 120           # match diffusion
depth_min_m: 0.25
depth_max_m: 0.85
num_cameras: 2
use_depth: true
vision_backbone: cnn      # same RGB-D CNN as policies/diffusion.py (not DINOv2)
freeze_backbone: false    # N/A for cnn; kept for API compatibility

style_dim: 32
kl_weight: 10.0

# --- Training (matched to diffusion defaults) ---
epochs: 80
batch_size: 8
lr: 0.0003
val_frac: 0.15
seed: 42
num_workers: 0

# --- Cameras ---
cameras:
  overhead:
    serial: "104122062828"
    exposure_us: 80
  side:
    serial: "024122062290"
    exposure_us: 200
  side2:
    serial: "925322061385"
    exposure_us: 200
record_camera_serial: ""
require_camera_serials: true

# --- Recording ---
record_hz: 15.0

# --- Deployment ---
deploy_hz: 15.0
action_scale: 1.0
deploy_speed_scale: 2.0
gripper_close_threshold: 0.5
