# Insert sensor: Diffusion Policy (CNN RGB-D + dense table XYZ + state → DDPM).
# No auxiliary heads. Optional side2 (zero-filled when missing). Separate checkpoint dir.
#
# Train:  python -m high_level_jobs.subtasks.insert_sensor --arch diffusion --train
# Deploy: python -m high_level_jobs.subtasks.insert_sensor --arch diffusion --deploy \
#           --model high_level_jobs/subtasks/insert_sensor/runs/diffusion/ep20_tablexyz/policy.pt

arch: diffusion

dataset_dir: software/high_level_jobs/subtasks/insert_sensor/dataset/episodes
model_path: software/high_level_jobs/subtasks/insert_sensor/runs/diffusion/ep20_tablexyz/policy.pt

# --- Model (Diffusion Policy) ---
history_len: 8
action_horizon: 8
temporal: transformer   # transformer | gru
latent_dim: 256
img_width: 160
img_height: 120
depth_min_m: 0.25
depth_max_m: 0.85
num_cameras: 3

# Overhead depth → table-frame XYZ channels (no YOLO)
use_table_xyz: true
table_calib_path: ""   # empty → newest valid calibration_table/runs/*/table_calib.json
table_xyz_xy_min_m: -0.40
table_xyz_xy_max_m: 0.40
table_xyz_z_min_m: -0.05
table_xyz_z_max_m: 0.35

diffusion_steps: 50
inference_steps: 16
beta_start: 0.0001
beta_end: 0.02

# --- Training ---
epochs: 80
batch_size: 8
lr: 0.0003
val_frac: 0.15
seed: 42
num_workers: 0

# --- Cameras (shared with ACT recording) ---
cameras:
  overhead:
    serial: "104122062828"
    exposure_us: 80
  side:
    serial: "024122062290"
    exposure_us: 200
  side2:
    serial: "925322061385"
    exposure_us: 200
record_camera_serial: ""
require_camera_serials: true

# --- Recording ---
record_hz: 15.0

# --- Deployment ---
deploy_hz: 15.0
action_scale: 1.0
deploy_speed_scale: 2.0
gripper_close_threshold: 0.5
