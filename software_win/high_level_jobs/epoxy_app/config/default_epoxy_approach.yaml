# Epoxy approach — three phases before / during apply (run separately for debug).
#
# Nominal pad spot (table inches): 10.75, 8.25, 5.5
# Safety: −0.25 in Y, +0.25 in Z → TCP 10.75, 8.00, 5.75
#
# Phases:
#   1) pre_apply  — WORK → rough TCP (safety-offset pose); single motion
#   2) xy_optimize — camera XY refine at fixed Z (placeholder for now)
#   3) z_creep    — vision FSM Z creeps (placeholder here; epoxy_apply)
#
# Preview / execute one phase:
#   $env:PYTHONPATH = "$PWD\software_win"
#   python -m high_level_jobs.epoxy_app --phase pre_apply --ik-gui
#   python -m high_level_jobs.epoxy_app --phase pre_apply --plan-gui
#   python -m high_level_jobs.epoxy_app --phase pre_apply --execute --port COM3
#   python -m high_level_jobs.epoxy_app --phase xy_optimize --execute
#   python -m high_level_jobs.epoxy_app --phase z_creep --execute

# Nominal table-frame spot (inches); safety offsets applied → tcp_table_xyz_in.
nominal_tcp_table_xyz_in: [10.5, 9.75, 6.75]
# y: subtracted; z: added (safer: back off in Y, higher in Z)
safety_offset_y_in: 0.25
safety_offset_z_in: 0.25
# Optional explicit override (inches). If set, skips nominal+offset.
# tcp_table_xyz_in: [10.75, 8.0, 5.75]

# UJ / final-link orientation vs table (NOT tip pitch about Y).
#   A controls roll (UJ tilt of link6); B controls pitch (gripper "yi" tip tilt).
#   A=0,  B=0 → HOME-family UJ (closer to table-parallel)
#   A=-90,B=0 → tip vertical (grab_sensor); UJ stood up
#   A=-30,B=0 → UJ 30° from parallel toward tip-down (no B/Y tip rotate)
# Do not use B for this — B=60 was rotating about Y, not UJ.
fixed_grasp_ab_deg: [-20.0, 0.0]
uj_tilt_from_parallel_deg: 20.0   # A = 0 - this; keep B=0
grasp_rpy_roll_offset_deg: -15.64
# Only teach A/B. Do not set C — IK ignores yaw; natural yaw from the solution.
ik_ignore_yaw: true
grasp_c_offset_deg: 0.0
grasp_rpy_yaw_base_deg: 180.0   # unused when ik_ignore_yaw
yaw_from_sensor_axis: false

grasp_orientation_tol_deg: 50.0
grasp_position_tol_mm: 20.0
ik_ori_vs_pos: 1.0
# Avoid useless J4/J6 spin from loose-ori IK (keeps wrist near WORK/start).
prefer_nearby_wrist: true

# --- Phase 1: pre_apply — WORK → rough TCP (y/z safety offsets); stay ---
pre_apply:
  orientation_tol_deg: 90.0
  plan_return_home: false

# --- Phase 2: XY optimize at fixed Z (camera later; placeholder now) ---
xy_optimize:
  enabled: true
  # Camera-based tip/pad XY refine — not implemented yet.
  placeholder: true
  camera: zelux   # intended sensor for future XY vision

# --- Phase 3: Z creeps (vision FSM; run via epoxy_apply for now) ---
z_creep:
  enabled: true
  placeholder: true

execute:
  joint_current_limit_a: 0
  home_confirm_attempts: 3

paths:
  robot: robot_design/Dummy_ros2_gripper_description/urdf/Dummy_ros2_gripper_grasp.urdf
  end_link: link6_1
  tcp_link: grasp_tcp_link
  save_debug_dir: software_win/high_level_jobs/epoxy_app/debug

load_environment: true
env_path: physical_env/packaging_station_edit.obj
enable_collision: false
plan_seed: 42
