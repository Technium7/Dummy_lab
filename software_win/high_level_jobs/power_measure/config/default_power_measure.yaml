# Windows power_measure — click top D415 → insert sensor from above.
#
# Measured point: click XY (table homography) + measured_height_in.
# TCP: measured + tcp_above_measured_in (+Z) and tcp_left_of_radial_in
#      (left of robot→click radial in table XY).
# Orientation: A=-90 + B=+90 so ik-gui long red axis (link local X) || table +Z
# (end-link body horizontal; TCP tip out in front). Yaw from radial then CW.

camera_to_robot:
  translation_m: [0.02473759406925837, 0.34061158616990395, 0.3150136487329851]
  rpy_deg: [102.40187601838566, -39.56813467465095, -1.9826286775152475]

camera_serial: ""

# Optional pin; else newest valid software_win/.../calibration_table/runs/*/table_calib.json
# (falls back to software/camera/calibration_table/runs/)
# table_calib_path: software_win/camera/calibration_table/runs/run_YYYYMMDD_HHMMSS/table_calib.json

measured_height_in: 2
tcp_above_measured_in: 4.25
tcp_left_of_radial_in: 1.25
yaw_cw_from_radial_deg: 90.0
min_radial_m: 0.001

# Semantic A/B → world RPY: roll=-a + roll_offset, pitch=-b.
# A=-90 keeps the grab-style roll family; B=+90 → pitch=-90 so link local X
# (longer red axis in --ik-gui) aligns with table +Z.
fixed_grasp_ab_deg: [-90.0, 90.0]
grasp_rpy_roll_offset_deg: -18.23
grasp_c_offset_deg: -90.0
grasp_rpy_yaw_base_deg: 180.0

grasp_orientation_tol_deg: 50.0
grasp_position_tol_mm: 20.0
ik_ori_vs_pos: 1.0

# Robot↔table + work_position_deg from physical_env/robot_in_table.yaml (edit there).
# grab_sensor / power_measure start and return at work_position (J1 still sequenced first).

# Thorlabs PM100(D) via pip package ThorlabsPM100 + PyVISA (λ default 400 nm).
power_meter:
  enabled: true
  wavelength_nm: 400.0
  visa_resource: ""     # e.g. USB0::0x1313::0x8078::P0046278::0::INSTR
  serial: "P0046278"     # pin by serial substring if multiple meters
  settle_s: 0.15
  samples_per_read: 3
  timeout_ms: 5000

# Maximize = directed climb toward higher intensity (not a full raster), limited
# to the side_mm×side_mm square. Cartesian-densified hops; no post-move settle waits.
power_scan:
  side_mm: 20.0
  sensor_radius_mm: 10.0
  grid_step_mm: 5.0
  detect_threshold_w: 1.0e-6
  contrast_ratio: 2.0
  contrast_delta_w: 1.0e-6
  insert_samples: 8
  optimize_step_mm: 2.5
  optimize_min_step_mm: 1.25
  optimize_max_iters: 16
  optimize_min_rel_improve: 0.02
  optimize_use_diagonals: false
  move_speed_scale: 0.12
  search_speed_scale: 0.12
  climb_speed_scale: 0.10
  send_interval_ms: 220.0
  settle_timeout_sec: 0.0
  meter_pause_s: 0.25
  final_speed_scale: 0.08
  final_send_interval_ms: 280.0
  final_hold_s: 0.7
  final_meter_samples: 5

approach:
  plan_pre_grasp: true
  pre_grasp_offset_mm: 50.0
  pre_grasp_along_xy: false   # approach from above along world +Z
  pre_grasp_orientation_tol_deg: 90.0
  post_grasp_lift_mm: 80.0
  plan_return_home: true
  retreat_after_close_mm: 0.0

execute:
  joint_current_limit_a: 0
  home_confirm_attempts: 3

paths:
  robot: robot_design/Dummy_ros2_gripper_description/urdf/Dummy_ros2_gripper_grasp.urdf
  end_link: link6_1
  tcp_link: grasp_tcp_link
  save_debug_dir: software_win/high_level_jobs/power_measure/debug

load_environment: false
enable_collision: true
plan_seed: 42
